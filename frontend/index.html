<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kadi Moja — NFC business cards. Share your contact details, links and social profiles with a simple tap. Works with iPhone and Android. No app required."
    />
    <meta name="theme-color" content="#0d7377" />
    <title>Kadi Moja — The Last Card You'll Ever Need</title>
    <link rel="icon" href="/favicon.ico?v=8" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png?v=8" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png?v=8" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=8" sizes="180x180" />

    <!-- iOS ignores the manifest for install behaviour — these drive "Add to Home Screen" there -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kadi Moja" />

    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Sora:wght@300;400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,200..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <style>
      .km-app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        min-height: 100vh;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 20% 18%, rgba(232, 145, 58, 0.28), transparent 27%),
          radial-gradient(circle at 85% 82%, rgba(74, 222, 200, 0.2), transparent 30%),
          linear-gradient(145deg, #075e62, #0d7377 55%, #109493);
        color: #fff;
        font-family: Sora, ui-sans-serif, system-ui, sans-serif;
      }
      .km-app-splash-mark {
        display: flex;
        width: 5.25rem;
        height: 5.25rem;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 1.5rem;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 24px 55px rgba(0, 35, 38, 0.28);
        animation: km-splash-mark 1.8s ease-in-out infinite;
      }
      .km-app-splash-mark img {
        width: 3.1rem;
        height: 3.75rem;
        object-fit: contain;
      }
      .km-app-splash-name {
        margin: 1.25rem 0 0;
        font-family: "Bricolage Grotesque", Sora, sans-serif;
        font-size: 1.55rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .km-app-splash-copy {
        margin: 0.35rem 0 0;
        color: rgba(255, 255, 255, 0.68);
        font-size: 0.78rem;
      }
      .km-app-splash-dots {
        display: flex;
        gap: 0.38rem;
        margin-top: 1.4rem;
      }
      .km-app-splash-dots span {
        width: 0.42rem;
        height: 0.42rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.75);
        animation: km-splash-dot 1.2s ease-in-out infinite;
      }
      .km-app-splash-dots span:nth-child(2) { animation-delay: 0.16s; }
      .km-app-splash-dots span:nth-child(3) { animation-delay: 0.32s; }
      @keyframes km-splash-mark {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-5px) scale(1.02); }
      }
      @keyframes km-splash-dot {
        0%, 60%, 100% { opacity: 0.35; transform: translateY(0); }
        30% { opacity: 1; transform: translateY(-4px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .km-app-splash-mark,
        .km-app-splash-dots span { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="km-app-splash" role="status" aria-label="Opening Kadi Moja">
        <div class="km-app-splash-mark">
          <img src="/logos/kadi-moja-mark.svg" alt="" />
        </div>
        <p class="km-app-splash-name">Kadi Moja</p>
        <p class="km-app-splash-copy">Opening your digital card</p>
        <div class="km-app-splash-dots" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
