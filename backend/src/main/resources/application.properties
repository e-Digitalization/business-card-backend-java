# =============================================================================
# Credentials & secrets live in backend/.env (gitignored).
# Template: backend/.env.example
# Start:    ./run.sh   or   mvn spring-boot:run  (from backend/)
# =============================================================================

server.port=8080
server.error.include-message=always

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/business_card}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.baseline-on-migrate=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.jwt.secret=${APP_JWT_SECRET:ChangeThisSecretInProduction-UseAtLeast32Chars}
app.jwt.expiration-ms=86400000
app.upload-dir=uploads

# First-boot admin account. Only created when BOTH ADMIN_USERNAME and
# ADMIN_PASSWORD are set and the admin_users table is empty — no default
# account is ever seeded otherwise.
app.admin.default-username=${ADMIN_USERNAME:}
app.admin.default-password=${ADMIN_PASSWORD:}

# Outbound email (account-verification OTPs). Set MAIL_HOST + MAIL_USERNAME +
# MAIL_PASSWORD and MAIL_ENABLED=true to deliver real messages; while disabled
# the OTP is written to the logs (and returned once to the sign-up screen).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=25000
spring.mail.properties.mail.smtp.writetimeout=25000
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:Kadi Moja <no-reply@kadimoja.com>}
app.auth.otp.ttl-minutes=${AUTH_OTP_TTL_MINUTES:15}

app.cors.allowed-origin=${FRONTEND_BASE_URL:http://localhost:5173}

# Google OAuth Web client ID (must match frontend VITE_GOOGLE_CLIENT_ID)
app.google.client-id=${GOOGLE_CLIENT_ID:521780660861-f7iv3a6m1jdujg9ilukdajtcp36fopdi.apps.googleusercontent.com}

# AI business-card scan — OPENAI_API_KEY or GEMINI_API_KEY in .env
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}

# Freemium AI scans → Selcom subscribe
app.scan.free-limit=${SCAN_FREE_LIMIT:2}
app.scan.monthly-limit=${SCAN_MONTHLY_LIMIT:20}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.public.base-url=${PUBLIC_BASE_URL:http://localhost:8080}

# Selcom — SELCOM_API_KEY, SELCOM_API_SECRET, SELCOM_VENDOR in .env
# If any are empty, checkout uses local demo payment.
app.selcom.base-url=${SELCOM_BASE_URL:https://apigw.selcommobile.com}
app.selcom.api-key=${SELCOM_API_KEY:}
app.selcom.api-secret=${SELCOM_API_SECRET:}
app.selcom.vendor=${SELCOM_VENDOR:}
app.selcom.amount-tzs=${SELCOM_AMOUNT_TZS:10000}
app.selcom.currency=${SELCOM_CURRENCY:TZS}
app.selcom.mock=${SELCOM_MOCK:false}

# NMB Payment Gateway (credentials also editable in Admin → Setups)
app.nmb.base-url=${NMB_BASE_URL:https://nmb.spg.co.tz}
app.nmb.client-usr=${NMB_CLIENT_USR:}
app.nmb.client-key=${NMB_CLIENT_KEY:}
app.nmb.system-name=${NMB_SYSTEM_NAME:}

# Physical NFC card product (active). Other catalogue options stay inactive in ProductCatalogService.
app.products.nfc-card.price-tzs=${NFC_CARD_PRICE_TZS:100000}
