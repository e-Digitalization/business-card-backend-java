<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kadi Moja — NFC business cards. Share your contact details, links and social profiles with a simple tap. Works with iPhone and Android. No app required."
    />
    <meta name="theme-color" content="#0d7377" />
    <title>Kadi Moja — The Last Card You'll Ever Need</title>
    <link rel="icon" href="/favicon.ico?v=8" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png?v=8" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png?v=8" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=8" sizes="180x180" />

    <!-- iOS ignores the manifest for install behaviour — these drive "Add to Home Screen" there -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kadi Moja" />

    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Sora:wght@300;400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,200..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <style>
      .km-app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        min-height: 100vh;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #0d7377;
        color: #fff;
        font-family: Sora, ui-sans-serif, system-ui, sans-serif;
      }
      .km-app-splash-mark {
        display: flex;
        width: 5.5rem;
        height: 6.5rem;
        align-items: center;
        justify-content: center;
        animation: km-splash-mark 1.5s ease-out both;
      }
      .km-app-splash-mark img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      @keyframes km-splash-mark {
        from { opacity: 0; transform: scale(0.88); }
        to { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .km-app-splash-mark { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="km-app-splash" role="status" aria-label="Opening Kadi Moja">
        <div class="km-app-splash-mark">
          <img src="/logos/kadi-moja-mark-light.svg" alt="" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
